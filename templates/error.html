<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Code}} — {{.Title}}</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .error-page { text-align: center; padding: 80px 20px; }
        .error-code { font-size: 6rem; font-weight: 700; margin: 0; line-height: 1; color: #e53e3e; }
        .error-title { font-size: 1.5rem; margin: 16px 0 8px; }
        .error-message { color: #666; margin-bottom: 32px; }
    </style>
</head>
<body>
<header class="site-header">
    <div class="container site-header-inner">
        <a href="/" class="site-logo"><h1 class="site-title">FORUM</h1></a>
    </div>
</header>
<main class="page">
<div class="container">
<section class="card error-page">
    <p class="error-code">{{.Code}}</p>
    <h2 class="error-title">{{.Title}}</h2>
    <p class="error-message">{{.Message}}</p>
    <a href="/" class="btn">На главную</a>
</section>
</div>
</main>
</body>
</html>
