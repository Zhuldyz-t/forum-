<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — {{.CurrentUser.Username}}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="manifest" href="/static/site.webmanifest">
</head>
<body>
<header class="site-header">
    <div class="container site-header-inner">
        <a href="/" class="site-logo"><h1 class="site-title">FORUM</h1></a>
        <nav class="nav-right">
            <a href="/profile" class="user-greeting">Привет, {{.CurrentUser.Username}}</a>
            <form action="/logout" method="POST" class="inline-form">
                <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                <button type="submit" class="btn">Выйти</button>
            </form>
        </nav>
    </div>
</header>
<main class="page">
<div class="container">
<section class="card profile-card">
    <div style="display: flex; gap: 24px; align-items: center;">
        <div class="profile-avatar-sq" style="width:220px;height:260px;margin-top:40px;border:2px solid #d1d5db;border-radius:16px;display:flex;align-items:center;justify-content:center;">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:170px;height:200px;">
                <circle cx="12" cy="8" r="4" fill="#d1d5db"/>
                <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8" fill="#d1d5db"/>
            </svg>
        </div>
        <div>
            <p class="profile-username">{{.CurrentUser.Username}}</p>
            <p class="profile-email">{{.CurrentUser.Email}}</p>
            <div class="avatar" style="margin-top:4px;">{{slice .CurrentUser.Username 0 1}}</div>
            <div class="profile-stats">
                <div class="stat">
                    <span class="stat-value">{{.PostCount}}</span>
                    <span class="stat-label">Постов</span>
                </div>
                <div class="stat">
                    <span class="stat-value">{{.CommentCount}}</span>
                    <span class="stat-label">Комментариев</span>
                </div>
            </div>
            <p class="profile-meta">На форуме с {{.CurrentUser.CreatedAt.Local.Format "02.01.2006"}}</p>
            <div class="profile-actions">
                <a href="/" class="btn secondary">На главную</a>
                <a href="/?filter=my_posts" class="btn">Мои посты</a>
            </div>
        </div>
    </div>
</section>
</div>
</main>
</body>
</html>
