<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — {{.CurrentUser.Username}}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header">
    <div class="container site-header-inner">
        <a href="/" class="site-logo"><h1 class="site-title">FORUM</h1></a>
        <nav class="nav-right">
            <a href="/profile" class="user-greeting">Привет, {{.CurrentUser.Username}}</a>
            <form action="/logout" method="POST" class="inline-form">
                <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                <button type="submit" class="btn">Выйти</button>
            </form>
        </nav>
    </div>
</header>
<main class="page">
<div class="container">
<section class="card profile-card">
    <div class="avatar">{{slice .CurrentUser.Username 0 1}}</div>
    <p class="profile-username">{{.CurrentUser.Username}}</p>
    <p class="profile-email">{{.CurrentUser.Email}}</p>
    <div class="profile-stats">
        <div class="stat">
            <span class="stat-value">{{.PostCount}}</span>
            <span class="stat-label">Постов</span>
        </div>
        <div class="stat">
            <span class="stat-value">{{.CommentCount}}</span>
            <span class="stat-label">Комментариев</span>
        </div>
    </div>
    <p class="profile-meta">На форуме с {{.CurrentUser.CreatedAt.Local.Format "02.01.2006"}}</p>
    <div class="profile-actions">
        <a href="/" class="btn secondary">На главную</a>
        <a href="/?filter=my_posts" class="btn">Мои посты</a>
    </div>
</section>
</div>
</main>
</body>
</html>
